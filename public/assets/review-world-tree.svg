    <radialGradient id="sun"><stop offset="0" stop-color="#fff9c7"/><stop offset=".42" stop-color="#ffe88a" stop-opacity=".82"/><stop offset="1" stop-color="#ffd866" stop-opacity="0"/></radialGradient>
