  <radialGradient id="sun"><stop offset="0" stop-color="#fff7b8"/><stop offset=".42" stop-color="#ffe676" stop-opacity=".82"/><stop offset="1" stop-color="#ffd75c" stop-opacity="0"/></radialGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ecf3"/><stop offset="1" stop-color="#7fa5b4"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8dc890"/><stop offset="1" stop-color="#47775b"/></linearGradient>
  <radialGradient id="ocean" cx=".35" cy=".25" r=".78"><stop stop-color="#53dcff"/><stop offset=".48" stop-color="#0f8ddd"/><stop offset="1" stop-color="#0755a5"/></radialGradient>
  <linearGradient id="island" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#b8e67e"/><stop offset=".45" stop-color="#59ad5f"/><stop offset="1" stop-color="#246e4c"/></linearGradient>
  <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b67848"/><stop offset=".5" stop-color="#7b492f"/><stop offset="1" stop-color="#4d2b24"/></linearGradient>
  <radialGradient id="leaf" cx=".35" cy=".25" r=".75"><stop stop-color="#d7f27a"/><stop offset=".38" stop-color="#62ba50"/><stop offset="1" stop-color="#1f7046"/></radialGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4ffff"/><stop offset=".45" stop-color="#b9f7ff"/><stop offset="1" stop-color="#67dfff"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#164f5b" flood-opacity=".28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

