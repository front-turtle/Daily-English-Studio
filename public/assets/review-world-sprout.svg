    <ellipse cx="1625" cy="155" rx="165" ry="66" fill="#fff"/><ellipse cx="1735" cy="164" rx="118" ry="48" fill="#fff"/>
  </g>
  
        <g filter="url(#shadow)">
          <ellipse cx="960" cy="810" rx="460" ry="125" fill="url(#meadow)"/>
          <path d="M720 825 C780 730 855 665 960 646 C1080 625 1196 675 1240 800 C1110 772 1005 786 910 826 C845 853 776 850 720 825Z" fill="#4f8f55" opacity=".36"/>
        </g>
        <g id="sprout" filter="url(#softShadow)">
