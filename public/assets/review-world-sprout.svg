          <ellipse cx="902" cy="648" rx="80" ry="34" transform="rotate(-28 902 648)" fill="url(#leaf)"/>
          <ellipse cx="1017" cy="610" rx="84" ry="36" transform="rotate(27 1017 610)" fill="url(#leaf2)"/>
          <ellipse cx="982" cy="720" rx="62" ry="28" transform="rotate(20 982 720)" fill="#50a84e"/>
        </g>
        <g opacity=".86">
          <circle cx="760" cy="846" r="9" fill="#fff"/><circle cx="779" cy="842" r="8" fill="#f8cf64"/>
          <circle cx="1135" cy="844" r="8" fill="#ff91bd"/><circle cx="1152" cy="838" r="7" fill="#fff"/>
        </g>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".35" pointer-events="none"/>
</svg>