    <linearGradient id="forestFloor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bde586"/><stop offset=".4" stop-color="#5ba65f"/><stop offset="1" stop-color="#286449"/></linearGradient>
    <radialGradient id="leaf" cx=".35" cy=".25" r=".75"><stop stop-color="#dff78b"/><stop offset=".4" stop-color="#72cf58"/><stop offset="1" stop-color="#28784a"/></radialGradient>
