    <radialGradient id="canopy" cx=".35" cy=".25" r=".75"><stop stop-color="#d7ef7f"/><stop offset=".38" stop-color="#65b852"/><stop offset="1" stop-color="#1e7046"/></radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b97949"/><stop offset=".52" stop-color="#7a4b32"/><stop offset="1" stop-color="#4e2d24"/></linearGradient>
    <radialGradient id="ocean" cx=".36" cy=".24" r=".8"><stop stop-color="#53dcff"/><stop offset=".5" stop-color="#0f8cda"/><stop offset="1" stop-color="#0752a0"/></radialGradient>
